<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-page-title="Sign In">Sign In</title>
  <script src="/static/js/theme-boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/branding.css" />
  <link rel="stylesheet" href="/static/css/mobile-responsive.css" />
</head>
<body>
  <main class="login-container">
    <div class="login-theme-slot">
      <button type="button" class="language-toggle-btn" data-language-toggle aria-label="Switch language" data-i18n-aria-label="common.switchLanguage">EN</button>
      <button type="button" class="theme-toggle-btn" data-theme-toggle aria-label="Toggle color theme" data-i18n-aria-label="common.toggleTheme">
        <span class="theme-icon-sun" aria-hidden="true">☀️</span>
        <span class="theme-icon-moon" aria-hidden="true">🌙</span>
      </button>
    </div>
    <div class="centered-card">
      <header class="login-header">
        <h1 data-brand-name>বন্ধুত্বের বন্ধন ফাউন্ডেশন</h1>
        <p class="login-subtitle" data-brand-login-subtitle>সদস্য ও আর্থিক ব্যবস্থাপনা প্ল্যাটফর্ম</p>
      </header>

      <form id="loginForm" class="form-card">
        <div class="form-group">
          <label>
            <span data-i18n="common.emailAddress">Email Address</span>
            <input type="email" name="email" data-i18n-placeholder="common.enterEmail" placeholder="Enter your email" required />
          </label>
        </div>
        <div class="form-group">
          <label>
            <span data-i18n="common.password">Password</span>
            <input type="password" name="password" data-i18n-placeholder="common.enterPassword" placeholder="Enter your password" required />
          </label>
        </div>
        <button type="submit" class="primary-btn" data-i18n="common.signIn">Sign In</button>
        <p id="message" class="message"></p>

        <p class="small-label" style="margin-top:1rem;">
          <a href="#recovery" id="showRecoveryLink" data-i18n="common.forgotPassword">Forgot password or locked out?</a>
        </p>
      </form>

      <form id="otpRequestForm" class="form-card hidden" style="margin-top:1rem;">
        <h2 style="font-size:1.1rem;margin:0 0 .5rem;" data-i18n="common.passwordRecoveryOtp">Password recovery OTP</h2>
        <p class="table-subtitle" data-i18n="common.passwordRecoveryHelp">We email a one-time code to your registered address. Share that OTP with User Management so they can verify you and set a new password.</p>
        <div class="form-group">
          <label>
            <span data-i18n="common.registeredEmail">Registered email</span>
            <input type="email" name="email" required placeholder="your@email.com" />
          </label>
        </div>
        <button type="submit" class="primary-btn" data-i18n="common.sendOtp">Send OTP</button>
        <button type="button" class="ghost-btn" id="backToLoginBtn" style="margin-top:.5rem;" data-i18n="common.backToSignIn">Back to sign in</button>
        <p id="otpMessage" class="message"></p>
      </form>
    </div>
  </main>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
