<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Society Management Login</title>
  <script src="/static/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/mobile-responsive.css" />
</head>
<body>
  <main class="login-container">
    <div class="login-theme-slot">
      <button type="button" class="theme-toggle-btn" data-theme-toggle aria-label="Toggle color theme">
        <span class="theme-icon-sun" aria-hidden="true">☀️</span>
        <span class="theme-icon-moon" aria-hidden="true">🌙</span>
      </button>
    </div>
    <div class="centered-card">
      <header class="login-header">
        <h1>SocietyHub</h1>
        <p class="login-subtitle">Society Management System</p>
      </header>

      <form id="loginForm" class="form-card">
        <div class="form-group">
          <label>
            Email Address
            <input type="email" name="email" placeholder="Enter your email" required />
          </label>
        </div>
        <div class="form-group">
          <label>
            Password
            <input type="password" name="password" placeholder="Enter your password" required />
          </label>
        </div>
        <button type="submit" class="primary-btn">Sign In</button>
        <p id="message" class="message"></p>

        <p class="small-label" style="margin-top:1rem;">
          <a href="#recovery" id="showRecoveryLink">Forgot password or locked out?</a>
        </p>
      </form>

      <form id="otpRequestForm" class="form-card hidden" style="margin-top:1rem;">
        <h2 style="font-size:1.1rem;margin:0 0 .5rem;">Password recovery OTP</h2>
        <p class="table-subtitle">We email a one-time code to your registered address. Share that OTP with User Management so they can verify you and set a new password.</p>
        <div class="form-group">
          <label>
            Registered email
            <input type="email" name="email" required placeholder="your@email.com" />
          </label>
        </div>
        <button type="submit" class="primary-btn">Send OTP</button>
        <button type="button" class="ghost-btn" id="backToLoginBtn" style="margin-top:.5rem;">Back to sign in</button>
        <p id="otpMessage" class="message"></p>
      </form>
    </div>
  </main>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
